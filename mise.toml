# see bootstrap.sh for a way to set everything up 

min_version = "2026.9.11"

# Mask these in captured task output. (Does not encrypt the file.)
redactions = [
  "*_ACCESS_KEY",
  "*_ACCESS_TOKEN",
  "*_API_KEY",
  "*_AUTH_HEADER",
  "*_SECRET_KEY",
]

#
[settings]
experimental = true

[settings.age]
ssh_identity_files = ["~/.ssh/mise_private_key"]

# ---------------------------------------------------------------- tools ----

[tools]
cmake = "latest"
claude = "latest"
docker-compose = "latest"
chromedriver = "latest"
youtube-dl = "latest"
java = "graalvm-community-25.0.2"
jbang = "0.141.0"
azure-cli = "latest"
dotnet-core = "latest"
python = "3.14.7"
gemini-cli = "latest"
neovim = "latest"
google-java-format = "latest"
gcloud = "latest"
gradle = "9.7.1"
docker-cli = "latest"
kotlin = { version = "2.4.20", asset_pattern = "kotlin-compiler-*.zip", bin_path = "kotlinc/bin" }
maven = "3.9.16"
kubectl = "latest"
jq = "latest"
go = "latest"
uv = "latest"
poetry = "latest"
postgres = "latest"
npm = "latest"
rust = "latest"
ollama = "latest"
httpie-go = "latest"
gh = "latest"
k9s = "latest"
awscli = "latest"
direnv = "latest"
sops = "latest"
ripgrep = "latest"
kubens = "latest"
kubent = "latest"

# ------------------------------------------------- environment variables ----

[env]
# Prepended to PATH, highest precedence first. 
_.path = [
  "/opt/homebrew/opt/curl/bin",
  "/opt/homebrew/opt/ruby/bin",
  "/opt/homebrew/opt/libpq/bin",
  "/opt/homebrew/opt/rustup/bin",
  "{{env.HOME}}/bin",
  "{{env.HOME}}/.docker/bin",
  "{{env.HOME}}/Library/Application Support/JetBrains/Toolbox/scripts",
  # brew shellenv's PATH half; last so the opt/* overrides above win.
  "/opt/homebrew/bin",
  "/opt/homebrew/sbin",
]

# rest of brew shellenv (its fpath half is in the final hook)
HOMEBREW_PREFIX = "/opt/homebrew"
HOMEBREW_CELLAR = "/opt/homebrew/Cellar"
HOMEBREW_REPOSITORY = "/opt/homebrew"
INFOPATH = "/opt/homebrew/share/info"

ZSH = "{{env.HOME}}/.oh-my-zsh"
EDITOR = "nvim"
VISUAL = "nvim"

AWS_REGION = "us-east-1"
DIRENV_WARN_TIMEOUT = "1m"
SSH_AUTH_SOCK = "{{env.HOME}}/Library/Containers/com.bitwarden.desktop/Data/.bitwarden-ssh-agent.sock"


OPENAI_KEY = { age = "" }
ANTHROPIC_KEY = { age = "" }
GITHUB_PERSONAL_ACCESS_TOKEN = { age = "" }



# ---------------------------------------------------------- shell aliases ----
# Applied by `mise activate` on directory entry (bash/zsh/fish only).

[shell_alias]
cfp = "cfp.sh"
emacs = "emacs -nw"
k = "kubectl"
dog = "cat"
uao = "java {{env.HOME}}/josh-env/bin/uao.java"
uaok = "{{env.HOME}}/josh-env/bin/uao.kts"

# ------------------------------------------------------- shell activation ----
# Without this, nothing ever writes ~/.zshrc, so a brand new shell has no mise,
# no tools and no [env]. it expands to two managed blocks:
# 
# ~/.zprofile (--shims, for login/non-interactive) 
# ~/.zshrc (activate, for interactive). 
#
# Both call bare `mise`, which is why bootstrap.sh
# must put ~/.local/bin on PATH via ~/.zshenv first.

[bootstrap.mise_shell_activate.zsh]
enabled = true

[bootstrap.hooks.final]
run = '''
ZSHRC="$HOME/.zshrc"
if grep -qF "# >>> mise bootstrap: shell init >>>" "$ZSHRC" 2>/dev/null; then
  echo "shell init: already wired"
else
  cat >> "$ZSHRC" <<'RC'

# >>> mise bootstrap: shell init >>>
# Order matters: fpath before oh-my-zsh (it runs compinit), precmd hooks after.
[ -d /opt/homebrew/share/zsh/site-functions ] && fpath=(/opt/homebrew/share/zsh/site-functions $fpath)
[ -d "$HOME/.docker/completions" ] && fpath=("$HOME/.docker/completions" $fpath)

export ZSH="${ZSH:-$HOME/.oh-my-zsh}"
ZSH_THEME="robbyrussell"   # change me
plugins=(git)              # change me
[ -r "$ZSH/oh-my-zsh.sh" ] && source "$ZSH/oh-my-zsh.sh"

command -v rbenv  >/dev/null && eval "$(rbenv init - zsh)"
command -v direnv >/dev/null && eval "$(direnv hook zsh)"

if [ "$TERM_PROGRAM" = "kiro" ] && command -v kiro >/dev/null; then . "$(kiro --locate-shell-integration-path zsh)"; fi
# <<< mise bootstrap: shell init <<<
RC
  echo "shell init: wired $ZSHRC"
fi
'''

# --------------------------------------------------------------- repos ----

[bootstrap.repos]
"~/.oh-my-zsh" = { url = "https://github.com/ohmyzsh/ohmyzsh.git" }

# ------------------------------------------------------------ brew taps ----
# mise resolves tapped formulae/casks itself; Homebrew need not be installed.
# Adopt apps already sitting in /Applications instead of failing on them.
# Relevant when bootstrapping over an existing machine rather than a fresh one.
[bootstrap.brew]
adopt = true

[bootstrap.brew.taps]
"arconia-io/tap" = "https://github.com/arconia-io/homebrew-tap.git"

