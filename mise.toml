# see bootstrap.sh for a way to set everything up 

min_version = "2026.9.11"

# Mask these in captured task output. (Does not encrypt the file.)
redactions = ["*_API_KEY", "*_ACCESS_TOKEN", "*_SECRET_KEY", "*_ACCESS_KEY", "*_AUTH_HEADER"]

#
[settings]
experimental = true

[settings.age]
ssh_identity_files = ["~/.ssh/mise_private_key"]

# ---------------------------------------------------------------- tools ----

[tools]
java   = "graalvm-community-25.0.2"
jbang  = "0.141.0"
python = "3.14.7"
gradle = "9.7.1"
kotlin = { version = "2.4.20", asset_pattern = "kotlin-compiler-*.zip", bin_path = "kotlinc/bin" }
maven = "3.9.16"


# ------------------------------------------------- environment variables ----

[env]
# Prepended to PATH, highest precedence first. This reproduces the net ordering
# of the stacked `export PATH=...:$PATH` lines in environment.sh.
#
# NB: these use {{env.HOME}}/josh-env rather than the config_root template.
# config_root resolves to the *cwd* when a config is loaded globally (via
# conf.d), which would silently point PATH at the wrong directory. Concrete
# paths also match what environment.sh and ~/.zshrc already hardcode.
#
# Dropped:
_.path = [
  "/opt/homebrew/opt/curl/bin",
  "/opt/homebrew/opt/ruby/bin",
  "/opt/homebrew/opt/libpq/bin",
  "/opt/homebrew/opt/rustup/bin",
  "{{env.HOME}}/bin",
  "{{env.HOME}}/.docker/bin",
  "{{env.HOME}}/Library/Application Support/JetBrains/Toolbox/scripts",
]

ZSH    = "{{env.HOME}}/.oh-my-zsh"
EDITOR = "nvim"
VISUAL = "nvim"

AWS_REGION          = "us-east-1"
DIRENV_WARN_TIMEOUT = "1m"
SSH_AUTH_SOCK       = "{{env.HOME}}/Library/Containers/com.bitwarden.desktop/Data/.bitwarden-ssh-agent.sock"
A = { age = "" }
DB_PASSWORD = { age = "" }


# ---------------------------------------------------------- shell aliases ----
# Applied by `mise activate` on directory entry (bash/zsh/fish only).

[shell_alias]
cfp   = "cfp.sh"
emacs = "emacs -nw"
k     = "kubectl"
dog   = "cat"
uao   = "java {{env.HOME}}/josh-env/bin/uao.java"
uaok  = "{{env.HOME}}/josh-env/bin/uao.kts"

# ------------------------------------------------------- shell activation ----
# Without this, nothing ever writes ~/.zshrc, so a brand new shell has no mise,
# no tools and no [env]. it expands to two managed blocks:
# 
# ~/.zprofile (--shims, for login/non-interactive) 
# ~/.zshrc (activate, for interactive). 
#
# Both call bare `mise`, which is why bootstrap.sh
# must put ~/.local/bin on PATH via ~/.zshenv first.

[bootstrap.mise_shell_activate.zsh]
enabled = true

# oh-my-zsh is cloned by [bootstrap.repos] and ZSH is exported in [env], but
# nothing SOURCES it -- mise's managed block only handles mise itself. Do that
# here, in the `final` hook, because it must land AFTER mise's block: $ZSH is a
# mise [env] value that only exists once `mise activate` has run, and shell
# activation happens back in the defaults/user phase. `final` runs last of all,
# after tools and after [tasks.bootstrap].
#
# Hooks re-run on every bootstrap, so this has to be idempotent -- hence the
# marker grep. Valid hook phases: pre/post-packages, -repos, -dotfiles,
# -defaults, -user, -tools, and final.

[bootstrap.hooks.final]
run = '''
ZSHRC="$HOME/.zshrc"
MARKER="# >>> mise bootstrap: oh-my-zsh >>>"
if grep -qF "$MARKER" "$ZSHRC" 2>/dev/null; then
  echo "oh-my-zsh: already wired in $ZSHRC"
else
  cat >> "$ZSHRC" <<'OMZ'

# >>> mise bootstrap: oh-my-zsh >>>
export ZSH="${ZSH:-$HOME/.oh-my-zsh}"
ZSH_THEME="robbyrussell"   # change me
plugins=(git)              # change me
[ -r "$ZSH/oh-my-zsh.sh" ] && source "$ZSH/oh-my-zsh.sh"
# <<< mise bootstrap: oh-my-zsh <<<
OMZ
  echo "oh-my-zsh: appended block to $ZSHRC"
fi
'''

# --------------------------------------------------------------- repos ----

[bootstrap.repos]
"~/.oh-my-zsh" = { url = "https://github.com/ohmyzsh/ohmyzsh.git" }

# ------------------------------------------------------------ brew taps ----
# mise resolves tapped formulae/casks itself; Homebrew need not be installed.
# Adopt apps already sitting in /Applications instead of failing on them.
# Relevant when bootstrapping over an existing machine rather than a fresh one.
[bootstrap.brew]
adopt = true

[bootstrap.brew.taps]
"arconia-io/tap" = "https://github.com/arconia-io/homebrew-tap.git"

# ------------------------------------------------------- system packages ----
# sync mise.toml with homebrew packages installed manually: 
# mise bootstrap packages import --manager brew

