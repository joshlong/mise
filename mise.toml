# josh-env — machine bootstrap
#
# Converted from environment.sh. Apply with:
#
#   mise trust
#   mise bootstrap --dry-run     # preview
#   mise bootstrap               # packages -> repos -> shell activation -> tools -> task
#
# On a brand new machine:
#   curl https://mise.run | sh
#   git clone git@github.com:joshlong/josh-env.git ~/josh-env
#   cd ~/josh-env && mise trust && mise bootstrap
#
# What mise does NOT own stays in environment.sh, which ~/.zshrc sources:
#   brew shellenv, oh-my-zsh + ZSH_THEME/plugins, docker completions/compinit,
#   `rbenv init -`, `direnv hook zsh`, kiro integration, and `mise activate`.
# mise deliberately does not manage ~/.zshrc; environment.sh owns shell init.
#
# IMPORTANT — this config must be loaded GLOBALLY, not just as a project
# config. A project mise.toml only applies inside its own directory, so from
# ~ you would get no PATH entries, no API keys, no SSH_AUTH_SOCK. Symlink it
# into the global conf.d once per machine:
#
#   mkdir -p ~/.config/mise/conf.d
#   ln -sfn ~/josh-env/mise.toml ~/.config/mise/conf.d/josh-env.toml
#
# (conf.d merges with ~/.config/mise/config.toml rather than replacing it,
# which MISE_GLOBAL_CONFIG_FILE would do.)

min_version = "2026.9.11"

# Mask these in captured task output. (Does not encrypt the file.)
redactions = ["*_API_KEY", "*_ACCESS_TOKEN", "*_SECRET_KEY", "*_ACCESS_KEY", "*_AUTH_HEADER"]

#
[settings]
experimental = true

[settings.age]
ssh_identity_files = ["~/.ssh/mise_private_key"]

# ---------------------------------------------------------------- tools ----

[tools]
java   = "graalvm-community-25.0.2"
jbang  = "0.141.0"
python = "3.14.7"
gradle = "9.7.1"
kotlin = { version = "2.4.20", asset_pattern = "kotlin-compiler-*.zip", bin_path = "kotlinc/bin" }
maven = "3.9.16"


# ------------------------------------------------- environment variables ----

[env]
# Prepended to PATH, highest precedence first. This reproduces the net ordering
# of the stacked `export PATH=...:$PATH` lines in environment.sh.
#
# NB: these use {{env.HOME}}/josh-env rather than the config_root template.
# config_root resolves to the *cwd* when a config is loaded globally (via
# conf.d), which would silently point PATH at the wrong directory. Concrete
# paths also match what environment.sh and ~/.zshrc already hardcode.
#
# Dropped:
_.path = [
  "/opt/homebrew/opt/curl/bin",
  "/opt/homebrew/opt/ruby/bin",
  "/opt/homebrew/opt/libpq/bin",
  "{{env.HOME}}/bin",
  "{{env.HOME}}/josh-env/bin/db",
  "{{env.HOME}}/josh-env/bin",
  "/opt/homebrew/opt/rustup/bin",
  "{{env.HOME}}/.docker/bin",
  "{{env.HOME}}/Library/Application Support/JetBrains/Toolbox/scripts",
]

ZSH    = "{{env.HOME}}/.oh-my-zsh"
EDITOR = "nvim"
VISUAL = "nvim"

AWS_REGION          = "us-east-1"
DIRENV_WARN_TIMEOUT = "1m"
SSH_AUTH_SOCK       = "{{env.HOME}}/Library/Containers/com.bitwarden.desktop/Data/.bitwarden-ssh-agent.sock"
A = { age = "" }
DB_PASSWORD = { age = "" }

# --- secrets ---------------------------------------------------------------
# Inline because josh-env is a private repo — same as environment.sh did. To
# pull them out, move this block into a git-ignored `mise.local.toml` (mise
# loads it automatically at higher precedence), or use
# https://mise.jdx.dev/environments/secrets.html for sops/age encryption.

# ---------------------------------------------------------- shell aliases ----
# Applied by `mise activate` on directory entry (bash/zsh/fish only).

[shell_alias]
cfp   = "cfp.sh"
emacs = "emacs -nw"
k     = "kubectl"
dog   = "cat"
uao   = "java {{env.HOME}}/josh-env/bin/uao.java"
uaok  = "{{env.HOME}}/josh-env/bin/uao.kts"

# --------------------------------------------------------------- repos ----

[bootstrap.repos]
"~/.oh-my-zsh" = { url = "https://github.com/ohmyzsh/ohmyzsh.git" }

# ------------------------------------------------------------ brew taps ----
# mise resolves tapped formulae/casks itself; Homebrew need not be installed.

# Adopt apps already sitting in /Applications instead of failing on them.
# Relevant when bootstrapping over an existing machine rather than a fresh one.
[bootstrap.brew]
adopt = true

[bootstrap.brew.taps]
"arconia-io/tap" = "https://github.com/arconia-io/homebrew-tap.git"

# ------------------------------------------------------- system packages ----
# Regenerate formulae with: mise bootstrap packages import --manager brew

[bootstrap.packages]

